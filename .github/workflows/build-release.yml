name: Build and Release EXE

# Fires only on version tags (e.g. v1.0.0, v1.2.3-beta) being pushed -- not
# on every push to a branch -- so a public release build only ever happens
# as a deliberate, explicit act (cutting a tag), matching the Android
# project's identical release-workflow trigger for consistency across both
# platforms' release processes.
on:
  push:
    tags:
      - "v*.*.*"

# Least-privilege token scope: this workflow only needs to create a Release
# and upload an asset to it.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release .exe
    # Pinned to windows-2022 rather than windows-latest. As of this
    # writing, windows-latest is mid-migration to a Visual Studio
    # 2026-based image, and that new image has been reported to drop the
    # Windows 10 SDK -- which build.rs's icon/manifest embedding step (via
    # the winresource crate, which needs rc.exe from *a* Windows SDK)
    # depends on. windows-2022 is GitHub's documented stable fallback with
    # a multi-year support window, so this sidesteps that migration risk
    # entirely rather than hoping it doesn't affect this specific build.
    # If you want to track windows-latest again later, do so deliberately
    # and verify a full build succeeds first.
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pins the exact same Rust version as rust-toolchain.toml via an
      # explicit `toolchain:` input -- this is deliberately NOT relying on
      # dtolnay/rust-toolchain auto-detecting rust-toolchain.toml, since
      # that auto-detection is a feature of forks/derivatives of this
      # action (e.g. dsherret/rust-toolchain-file, actions-rust-lang/
      # setup-rust-toolchain) rather than confirmed, documented behavior of
      # dtolnay/rust-toolchain itself. An explicit, matching version here
      # is the verifiable choice; if you bump rust-toolchain.toml's channel,
      # bump the toolchain: value below to match in the same commit.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78.0"
          targets: x86_64-pc-windows-msvc

      - name: Show toolchain in use
        run: rustc --version --verbose

      # GitHub's windows-2022 runner image ships ImageMagick preinstalled.
      # If a future runner image update ever drops it, this step fails
      # loudly with a clear error rather than silently shipping a build
      # with no icon.
      - name: Generate icon.ico and RGBA window/tray icons
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            Write-Error "ImageMagick not found on this runner image (windows-2022). If GitHub has dropped it from this image, install it explicitly here (e.g. via choco/winget) before this step."
            exit 1
          }
          ./scripts/generate-icon.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # NOTE: no --locked here. This repo does not commit Cargo.lock (it
      # can only be correctly generated by resolving the real dependency
      # graph against crates.io, which requires network access this
      # project was authored without). The very first `cargo build` --
      # here in CI or locally -- generates Cargo.lock automatically. Once
      # that file exists and is committed, add --locked to this command so
      # CI fails loudly on any accidental dependency drift instead of
      # silently resolving to newer versions than what was last tested.
      # See README.md "First build" for this one-time step.
      - name: Build release binary
        run: cargo build --release --verbose

      - name: Locate built EXE
        id: exe
        shell: pwsh
        run: |
          $exePath = "target/release/YFP.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Expected EXE not found at $exePath -- build must have failed silently or [[bin]] name in Cargo.toml no longer matches."
            exit 1
          }
          echo "path=$exePath" >> $env:GITHUB_OUTPUT

      # Reports the actual artifact size in the workflow log on every run
      # (not just release-tag runs would, if this step also ran on a
      # regular PR build) -- surfaces a size regression the moment it
      # happens rather than only being noticed much later when someone
      # happens to check. The build is optimized for size (see
      # [profile.release] in Cargo.toml: opt-level="z", lto=true, strip,
      # panic=abort) specifically so this stays small; this step exists to
      # keep that claim honest and checkable rather than just asserted in
      # a comment somewhere.
      - name: Report binary size
        shell: pwsh
        run: |
          $exePath = "${{ steps.exe.outputs.path }}"
          $sizeBytes = (Get-Item $exePath).Length
          $sizeMb = [math]::Round($sizeBytes / 1MB, 2)
          Write-Host "YFP.exe size: $sizeMb MB ($sizeBytes bytes)"
          echo "### Release binary size: $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY

      - name: Extract version name from tag
        id: version
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $versionName = $rawTag -replace '^v', ''
          echo "raw_tag=$rawTag" >> $env:GITHUB_OUTPUT
          echo "version_name=$versionName" >> $env:GITHUB_OUTPUT

      - name: Rename EXE for release asset
        id: rename
        shell: pwsh
        run: |
          $dest = "YFP-${{ steps.version.outputs.version_name }}.exe"
          Copy-Item "${{ steps.exe.outputs.path }}" $dest
          echo "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_tag }}
          name: "YFP ${{ steps.version.outputs.raw_tag }}"
          body: |
            Automated release build of YFP (Your Files Protector) by MNM Younus for Windows.

            **This is a portable single-file app -- no installer.** Download
            `YFP-${{ steps.version.outputs.version_name }}.exe` and run it directly;
            nothing else is required.

            **First-run SmartScreen note:** this build is not code-signed with
            an EV certificate (those cost money and this project is free and
            open source), so Windows SmartScreen may show an "unrecognized
            app" warning the first time you run it. Click "More info" then
            "Run anyway" if you've verified you downloaded this from the
            official GitHub Releases page. The source is fully open in this
            repository if you'd like to build it yourself instead.

            100% offline · Zero ads · Zero tracking · No installer.
          files: ${{ steps.rename.outputs.path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.raw_tag, '-') }}
